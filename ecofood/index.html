<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>EcoFood</title>
<style>
:root{--g:#3a3a3c;--b:#0d9ad8;--b2:#0b86c0;--r:#ee2d3d;--y:#e0a100;--ok:#1b8a4a;--bg:#f2f6f9;--card:#fff;--tx:#2a2a2c;--mu:#6b747d;--ln:#dfe7ee;--lb:#e6f3fa}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);font-size:15px}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;background:var(--bg)}
.top{background:#fff;padding:12px 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--ln);flex:none}
.brand{display:flex;align-items:center;gap:8px}
.brand b{font-size:18px;letter-spacing:-.3px}.brand b span{color:var(--b)}
.brand small{display:block;font-size:9px;letter-spacing:2px;color:var(--mu);font-weight:600}
.av{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;position:relative;font-size:14px}
.av.dot:after{content:"";position:absolute;top:0;right:0;width:10px;height:10px;border-radius:50%;background:var(--r);border:2px solid #fff}
.main{flex:1;overflow-y:auto;padding:14px 14px 90px}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:760px;margin:0 auto;background:#fff;border-top:1px solid var(--ln);display:flex;height:62px;z-index:5}
.nav button{flex:1;border:0;background:none;font-size:11px;color:#8f959c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:inherit}
.nav button i{font-style:normal;font-size:20px;line-height:1}
.nav button.on{color:var(--b);font-weight:700;box-shadow:inset 0 3px 0 var(--b)}
h2{font-size:18px;margin:2px 0 12px;display:flex;align-items:center;gap:8px}
.back{border:0;background:#fff;width:34px;height:34px;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:18px;color:var(--g)}
.sec{font-weight:700;font-size:15px;border-left:4px solid var(--r);padding-left:8px;margin:16px 0 10px;display:flex;align-items:center}
.sec a{margin-left:auto;font-size:12px;color:var(--b);font-weight:600;text-decoration:none}
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 2px 8px rgba(58,58,60,.07);margin-bottom:10px}
.hero{background:linear-gradient(120deg,var(--g),#55575a);color:#fff;border-radius:16px;padding:16px;margin-bottom:6px}
.hero b{font-size:18px}.hero div{font-size:13px;opacity:.88;margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(58,58,60,.07);border-top:4px solid var(--b);font-weight:600;font-size:14px;cursor:pointer;position:relative}
.qa:nth-child(even){border-top-color:var(--r)}
.qa i{font-style:normal;font-size:22px;display:block;margin-bottom:6px}
.qa .n{position:absolute;top:10px;right:10px}
.row{display:flex;gap:10px;align-items:center}
.dt{width:50px;flex:none;text-align:center;background:var(--lb);border-radius:10px;padding:5px 0;color:var(--b2)}
.dt small{display:block;font-size:9px;font-weight:700;letter-spacing:.5px}.dt b{display:block;font-size:20px;line-height:1.1}
.dt.dark{background:var(--g);color:#fff}
.ttl{font-weight:700;font-size:14.5px}.sub{color:var(--mu);font-size:12.5px;margin-top:2px}
.sel{display:inline-block;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.s-r{background:#fde2e4;color:#c2182a}.s-y{background:#fff3cd;color:#8a5a00}.s-b{background:#ddf0fa;color:#0b74a6}.s-ok{background:#dcf3e4;color:var(--ok)}.s-g{background:#eceff2;color:var(--g)}.s-p{background:#f3e5fb;color:#7b2ca3}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-size:14.5px;font-weight:700;background:var(--b);color:#fff;font-family:inherit;margin-top:8px}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:12.5px;margin-top:0}
.btn.out{background:#fff;color:var(--b);border:1.5px solid var(--b)}
.btn.wa{background:#25d366}.btn.red{background:var(--r)}.btn.gray{background:var(--g)}
.lbl{font-size:12.5px;font-weight:700;color:#4a525a;margin:10px 0 4px;display:block}
input,select,textarea{width:100%;border:1.5px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:15px;font-family:inherit;background:#f8fafc;color:var(--tx)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--b);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--ln);background:#fff;border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--g)}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.seg{display:flex;background:#e3e9ee;border-radius:20px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;border-radius:17px;padding:8px;font-weight:700;font-size:13px;color:var(--mu);font-family:inherit}
.seg button.on{background:var(--g);color:#fff}
.hr{display:flex;gap:10px;align-items:center}
.hr .h{width:52px;color:var(--b2);font-weight:700;font-size:13px}.hr .h small{display:block;color:#9aa1a8;font-weight:500}
.hr .d{flex:1;border-left:2px solid var(--ln);padding-left:10px}
.empty{text-align:center;color:var(--mu);padding:24px 10px;font-size:13.5px}
#toasts{position:fixed;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:20;pointer-events:none}
.toast{background:var(--g);color:#fff;padding:11px 16px;border-radius:12px;font-size:13.5px;max-width:92%;box-shadow:0 6px 18px rgba(0,0,0,.25);transition:opacity .3s}
.fab{position:fixed;right:18px;bottom:78px;width:56px;height:56px;border-radius:50%;background:var(--r);color:#fff;border:0;font-size:30px;box-shadow:0 6px 16px rgba(238,45,61,.4);z-index:6}
.login{padding:22px 18px;overflow-y:auto;flex:1}
.login .logo{display:block;width:150px;margin:6px auto 4px}
.demo{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 5px rgba(0,0,0,.06);cursor:pointer}
.demo .av{margin:0;width:38px;height:38px}
.bar{height:12px;border-radius:6px;background:var(--b)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.sw{width:46px;height:26px;border-radius:13px;background:#cfd6dc;position:relative;flex:none;border:0}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--b)}.sw.on:after{left:23px}
.del{border:0;background:none;color:var(--r);font-size:12.5px;font-weight:700}
.note{font-size:12px;color:var(--mu);text-align:center;margin-top:14px;line-height:1.5}

.ic{display:inline-block;vertical-align:middle;flex:none}
.nav button .ic{width:22px;height:22px}
.qa .ic{width:26px;height:26px;display:block;margin-bottom:8px;color:var(--b)}
.qa:nth-child(even) .ic{color:var(--r)}
h2 .ic{width:20px;height:20px;color:var(--b)}
.main>*{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;background:#fff;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;transition:opacity .45s}
#splash img{width:170px}
#splash .ap{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:800;color:var(--g);animation:pop .6s ease}
#splash .ap span{color:var(--b)}
#splash .ld{width:120px;height:4px;border-radius:2px;background:#e3e9ee;overflow:hidden}
#splash .ld i{display:block;height:100%;width:40%;background:var(--b);border-radius:2px;animation:ld 1s infinite ease-in-out}
@keyframes ld{0%{margin-left:-40%}100%{margin-left:100%}}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
.car{position:relative;border-radius:18px;overflow:hidden;height:150px;margin-bottom:6px}
.slide{position:absolute;inset:0;padding:18px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;transform:translateX(100%);transition:transform .55s ease}
.slide.on{transform:none}.slide.sai{transform:translateX(-100%)}
.slide b{font-size:19px;line-height:1.2}.slide div{font-size:13px;opacity:.9;margin-top:4px}
.slide .big{position:absolute;right:14px;top:12px;width:70px;height:70px;opacity:.25}
.dots{display:flex;justify-content:center;gap:6px;margin:6px 0 2px}
.dots i{width:7px;height:7px;border-radius:4px;background:#c8d3dc;transition:.3s}.dots i.on{width:20px;background:var(--g)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:center;justify-content:center;padding:24px}
.modal .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:340px;animation:pop .2s ease}
.modal .box b{font-size:16px}.modal .box p{color:var(--mu);font-size:14px;margin:8px 0 14px;line-height:1.45}
.modal .row{gap:8px}.modal .btn{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:10.5px;font-weight:700;color:var(--mu);padding:4px 0}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:#f5f8fa;position:relative}
.cal .d.x{background:none}
.cal .d.hj{background:var(--g);color:#fff}
.cal .d .pt{display:flex;gap:2px;position:absolute;bottom:4px}
.cal .d .pt i{width:5px;height:5px;border-radius:50%}
.prog{height:8px;border-radius:4px;background:#e3e9ee;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--ok)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 6px}
.kpis .k{margin:0;cursor:pointer}.kpis .k b{font-size:26px;display:block;line-height:1.2}
@media(min-width:600px){.kpis{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(4,1fr)}}
.li{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid #eef2f5}.li:last-child{border-bottom:0}
.lv{height:10px;border-radius:5px;background:#e3e9ee;overflow:hidden}.lv i{display:block;height:100%;border-radius:5px}
.stp{display:flex;align-items:center;border:1.5px solid var(--ln);border-radius:12px;overflow:hidden;flex:none}
.stp button{width:38px;height:40px;border:0;background:#f2f6f9;font-size:22px;color:var(--b2);font-weight:700}
.stp input{width:56px;border:0;border-radius:0;text-align:center;padding:8px 2px;background:#fff;font-weight:700}
.nav button{position:relative}.nav button em{position:absolute;top:6px;left:56%;background:var(--r);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:9px;padding:1px 5px}
.btn .ic{vertical-align:-3px}

@media (min-width:900px){
 #app{max-width:none}
 .top{height:64px;padding:0 24px;position:relative;z-index:6}
 .nav{top:64px;bottom:0;left:0;right:auto;width:230px;height:auto;max-width:none;margin:0;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--ln);padding:16px 10px;gap:4px}
 .nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:46px;padding:0 16px;font-size:14.5px;border-radius:10px;color:#5b6570}
 .nav button.on{box-shadow:none;background:#e6f3fa}
 .nav button em{position:static;margin-left:auto}
 .main{margin-left:230px;padding:24px 32px 32px}
 .main>*{max-width:1100px}
 .car{height:170px}
 .kpis{grid-template-columns:repeat(4,1fr)}
 .grid{grid-template-columns:repeat(4,1fr)}
 .login{max-width:480px;margin:0 auto;padding-top:40px}
 .fab{bottom:24px}
 #toasts{left:auto;right:20px;top:76px;align-items:flex-end}
}

.foto{position:relative;border-radius:14px;overflow:hidden;flex:none;display:flex;align-items:flex-end;justify-content:center}
.foto svg{position:absolute;inset:0}
.foto span{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.35);color:#fff;font-size:10px;font-weight:700;border-radius:6px;padding:1px 4px}
.pdv{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start}
.pdv .k{margin-bottom:10px}.k b{font-size:28px;display:block;line-height:1.2}
.ultima{display:flex;gap:16px;align-items:center}
.ult6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.u6{display:flex;gap:10px;align-items:center;margin:0}
.u6.novo{outline:3px solid var(--b)}
.hl{display:flex;justify-content:space-between;font-size:12.5px;padding:2px 6px;border-radius:6px}.hl.on{background:#ddf0fa}
.sit4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpis5{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kpis5 .k{margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qa.big{display:flex;flex-direction:column;gap:8px;padding:22px}.qa.big b{font-size:17px}
.podio{display:flex;gap:16px;align-items:flex-end;justify-content:center;margin-top:18px}
.pd{flex:0 1 260px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px;text-align:center}
body.modo #splash{display:none}
body.modo{background:#fff}
.totem{position:fixed;inset:0;background:linear-gradient(150deg,#2b2c2e,#3a3a3c 45%,#0b5f88);color:#fff;padding:26px 34px;display:flex;flex-direction:column}
.tt3{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:18px;margin-top:22px;flex:1;max-height:430px}
.tc{background:rgba(255,255,255,.1);border-radius:20px;padding:22px;display:flex;flex-direction:column}
.tc .tag{font-size:14px;letter-spacing:1px;opacity:.85}.tc .pn{font-size:30px;font-weight:800;margin-top:10px;line-height:1.2}
.tc.agora{background:#fff;color:var(--g);box-shadow:0 10px 30px rgba(0,0,0,.3)}.tc.agora .tag{color:var(--b2);opacity:1;font-weight:800}
.tw{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 12px;font-size:14px;max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tw.on{background:#fff;color:var(--g);font-weight:700}
.faixa{margin-top:16px;background:#ffc93c;color:#3d2a00;border-radius:16px;padding:16px;text-align:center;font-size:32px;font-weight:900;animation:pulsa 1.2s infinite}
@keyframes pulsa{50%{transform:scale(1.02)}}
.tablet{position:fixed;inset:0;background:#f7fafc;padding:20px 30px;display:flex;flex-direction:column}
.notas4{display:flex;gap:16px;justify-content:center;margin:22px 0 10px}
.nt{width:160px;border-radius:20px;padding:16px;cursor:pointer;border:4px solid transparent;transition:.15s}.nt:hover{transform:translateY(-3px)}.nt.on{border-color:var(--b)}
.tv{position:fixed;inset:0;padding:24px 40px;background:#fff;overflow:auto}
.fotos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tfoto{margin-top:auto;flex:1;min-height:140px;background-size:contain;background-repeat:no-repeat;background-position:center bottom;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35))}
.chip{cursor:pointer}.qa{cursor:pointer}
@media (min-width:900px){.main>*{max-width:1250px}}

/* ===== versão para celular (teste online) ===== */
@media (max-width:700px){
 body{font-size:14px}
 .top{padding:10px 12px}
 .top .row>.sub{display:none}
 .nav{overflow-x:auto;justify-content:flex-start;scrollbar-width:none}
 .nav::-webkit-scrollbar{display:none}
 .nav button{flex:0 0 78px;font-size:10px;line-height:1.15;text-align:center;padding:0 3px}
 .main{padding:12px 12px 84px}
 .main .row[style*="margin-bottom:12px"]{flex-wrap:wrap;row-gap:8px}
 .main .row[style*="margin-bottom:12px"]>[style*="margin-left:auto"]{margin-left:0!important}
 h2{font-size:17px}
 .pdv,.grid2,.grid3,.sit4,.ult6{grid-template-columns:1fr}
 .kpis5{grid-template-columns:1fr 1fr}
 .kpis .k b,.kpis5 .k b,.k b{font-size:22px}
 .fotos{grid-template-columns:1fr 1fr;gap:8px}
 .pdv .card[style*="display:flex"]{flex-wrap:wrap}
 .pdv .card[style*="display:flex"] input{min-width:0;flex:1 1 100%!important;font-size:15px!important}
 .ultima{gap:12px}
 .ultima>.foto{width:80px!important;height:80px!important}
 .ultima [style*="font-size:22px"]{font-size:18px!important}
 .podio{gap:6px}
 .pd{flex:1 1 0;min-width:0;padding:6px}
 .pd img{width:100%!important;height:auto!important;max-height:70px}
 .pd b{font-size:12px!important}
 .pd div[style*="font-size:28px"],.pd div[style*="font-size:40px"]{font-size:20px!important}
 /* cardápio e pesagem: um dia por cartão, refeições uma embaixo da outra */
 .card[style*="padding:6px 14px"] .li:first-child{display:none}
 .card[style*="padding:6px 14px"] .li{flex-wrap:wrap;gap:6px 8px;padding:12px 4px}
 .card[style*="padding:6px 14px"] .li>*{width:auto!important;flex:1 1 100%!important;text-align:left!important}
 .card[style*="padding:6px 14px"] .li>button{flex:0 0 auto!important}
 .li:has(>button)>span:nth-of-type(1)::before{content:"1º lanche";}
 .li:has(>button)>span:nth-of-type(2)::before{content:"Almoço";}
 .li:has(>button)>span:nth-of-type(3)::before{content:"2º lanche";}
 .li:has(>button)>span:nth-of-type(4)::before{content:"Restrição: ";font-weight:700}
 .li:has(>button)>span:nth-of-type(-n+3)::before{display:block;min-width:64px;font-size:11px;font-weight:700;color:var(--mu)}
 .card[style*="padding:6px 14px"] .li:not(:has(>button))>span:nth-of-type(2)::before{content:"1º lanche"}
 .card[style*="padding:6px 14px"] .li:not(:has(>button))>span:nth-of-type(3)::before{content:"Almoço"}
 .card[style*="padding:6px 14px"] .li:not(:has(>button))>span:nth-of-type(4)::before{content:"2º lanche"}
 .card[style*="padding:6px 14px"] .li:not(:has(>button))>span:nth-of-type(n+2)::before{display:block;font-size:11px;font-weight:700;color:var(--mu)}
 .card[style*="padding:6px 14px"] .li:not(:has(>button))>b:last-child::before{content:"Total: ";color:var(--mu)}
 /* telas do totem, tablet e mural no celular (formato vertical) */
 .totem,.tablet,.tv{padding:14px;overflow-y:auto}
 .totem [style*="font-size:34px"]{font-size:22px!important}
 .totem [style*="font-size:18px"]{font-size:14px!important}
 .totem #relogio{font-size:26px!important}
 .totem img[style*="height:46px"]{height:32px!important}
 .tt3{grid-template-columns:1fr;max-height:none;flex:none;gap:12px;margin-top:14px}
 .tc{padding:16px}
 .tc .pn{font-size:22px}
 .tfoto{min-height:150px}
 .tw{max-width:100%;font-size:12.5px}
 .faixa{font-size:20px;padding:12px}
 .tablet [style*="font-size:30px"]{font-size:22px!important}
 .tablet [style*="font-size:22px"]{font-size:17px!important}
 .tablet [style*="font-size:90px"]{font-size:60px!important}
 .tablet img[style*="width:260px"]{width:200px!important;height:130px!important}
 .tablet img[style*="height:42px"]{height:30px!important}
 .notas4{flex-wrap:wrap;gap:10px;margin:14px 0 8px}
 .nt{width:44%;padding:10px}
 .nt div[style*="font-size:64px"]{font-size:44px!important}
 .nt b{font-size:16px!important}
 .tablet>div:last-child{justify-content:flex-start!important;padding-top:16px}
 .tv [style*="font-size:34px"]{font-size:22px!important}
 .tv [style*="font-size:30px"]{font-size:22px!important}
 .tv img[style*="height:56px"]{height:34px!important}
 .tv .pd[style*="height"]{height:auto!important;min-height:220px}

}

let perRel = 28;
function estatPratos(dias) { const av = DB.avaliacoes.filter(a => (parse(iso(hoje())) - parse(a.data)) / 86400000 < dias); const m = {};
  av.forEach(a => { const k = a.prato; (m[k] = m[k] || {prato:k, ref:a.refeicao, n:0, bom:0}).n++; if (a.nota >= 3) m[k].bom++; });
  return Object.values(m).filter(x => x.n >= 3).map(x => ({...x, p:pct(x.bom, x.n)})).sort((a,b) => b.p - a.p); }
TELAS.relatorios = u => {
  const dias = [...new Set(DB.registros.map(x => x.data))].filter(d => (parse(iso(hoje())) - parse(d)) / 86400000 < perRel).sort();
  const regs = DB.registros.filter(x => dias.includes(x.data) && !x.repeticao);
  const tot = DB.alunos.length; const adesao = r => { const v = dias.map(d => regs.filter(x => x.data === d && x.refeicao === r).length).filter(n => n > 0); return v.length ? pct(v.reduce((a,b)=>a+b,0) / v.length, tot) : 0; };
  const semComer = dias.map(d => tot - new Set(regs.filter(x => x.data === d).map(x => x.alunoId)).size); const mSem = semComer.length ? Math.round(semComer.reduce((a,b)=>a+b,0) / semComer.length) : 0;
  const av = DB.avaliacoes.filter(a => dias.includes(a.data)); const pr = estatPratos(perRel);
  const pes = DB.pesagens.filter(p => dias.includes(p.data)); const kgDia = dias.map(d => pes.filter(p => p.data === d).reduce((t,p) => t + p.kg, 0)); const mKg = kgDia.length ? kgDia.reduce((a,b)=>a+b,0) / kgDia.length : 0;
  const reps = DB.registros.filter(x => dias.includes(x.data) && x.repeticao).length;
  const porT = TURMAS.map(t => { const al = DB.alunos.filter(a => a.turma === t); const s = dias.map(d => al.filter(a => !regs.some(x => x.data === d && x.alunoId === a.id)).length); return [t, al.length ? pct(s.reduce((a,b)=>a+b,0) / (s.length || 1), al.length) : 0]; }).sort((a,b) => b[1] - a[1]);
  const W = 520, H = 120, ult = kgDia.slice(-15), mk = Math.max(...ult, 1); const pts = ult.map((v,i) => `${20 + i * (W - 30) / Math.max(1, ult.length - 1)},${H - 12 - v / mk * (H - 30)}`).join(' ');
  const txt = `📊 EcoFood — relatório (${perRel===7?'7':'28'} dias)\nAlmoço: ${adesao('Almoço')}% • 1º lanche: ${adesao('1º lanche')}% • 2º lanche: ${adesao('2º lanche')}%\nSem comer (média/dia): ${mSem} aluno(s)\nSobras: ${fmt(mKg)} kg/dia\nMais aceito: ${pr[0]?pr[0].prato+' ('+pr[0].p+'%)':'—'}\nMenos aceito: ${pr.length?pr[pr.length-1].prato+' ('+pr[pr.length-1].p+'%)':'—'}`;
  return `<div class="row" style="margin-bottom:12px"><h2 style="margin:0">${ic('chart')} Relatórios da gestão</h2><span style="margin-left:auto" class="chips"><span class="chip ${perRel===7?'on':''}" onclick="perRel=7;render()">7 dias</span><span class="chip ${perRel===28?'on':''}" onclick="perRel=28;render()">4 semanas</span></span>
    <button class="btn sm wa" onclick='compartilhar(${JSON.stringify(txt)})'>${ic('share',16)} WhatsApp</button></div>
   <div class="kpis5"><div class="card k"><div class="sub">Almoço</div><b>${adesao('Almoço')}%</b><div class="sub">pegaram</div></div><div class="card k"><div class="sub">1º lanche</div><b>${adesao('1º lanche')}%</b><div class="sub">pegaram</div></div>
    <div class="card k"><div class="sub">2º lanche</div><b>${adesao('2º lanche')}%</b><div class="sub">pegaram</div></div><div class="card k" style="background:#fdecee"><div class="sub">Sem comer</div><b style="color:var(--r)">${mSem}</b><div class="sub">alunos/dia (${pct(mSem,tot)}%)</div></div>
    <div class="card k"><div class="sub">Sobras</div><b>${fmt(mKg)} kg</b><div class="sub">por dia</div></div><div class="card k"><div class="sub">Bom/ótimo</div><b>${av.length?pct(av.filter(a=>a.nota>=3).length,av.length):0}%</b><div class="sub">${av.length} avaliações</div></div>
    <div class="card k"><div class="sub">Cardápio seguido</div><b>${av.length?pct(av.filter(a=>a.seguido).length,av.length):0}%</b></div><div class="card k"><div class="sub">Repetições</div><b>${reps}</b></div></div>
   <div class="pdv"><div class="card"><div class="ttl" style="margin-bottom:8px">👍 Mais aceitos (% bom/ótimo)</div>${pr.slice(0,5).map(x => barraP(x,'var(--ok)')).join('')}
     <div class="ttl" style="margin:14px 0 8px;color:var(--r)">👎 Menos aceitos</div>${pr.slice(-4).reverse().map(x => barraP(x,'var(--r)')).join('')}</div>
    <div><div class="card"><div class="ttl">Sobras por dia (kg)</div><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><polyline fill="none" stroke="#2f7a49" stroke-width="3" points="${pts}"/>${ult.map((v,i) => `<circle cx="${20 + i * (W - 30) / Math.max(1, ult.length - 1)}" cy="${H - 12 - v / mk * (H - 30)}" r="4" fill="${v > mKg * 1.25 ? '#c8643b' : '#2f7a49'}"/>`).join('')}</svg>
     <div class="sub">Pontos vermelhos: dias com sobra acima da média — confira o prato do dia na tela de pesagem.</div></div>
     <div class="card"><div class="ttl" style="margin-bottom:6px">Turmas que mais ficam sem comer</div>${porT.slice(0,4).map(([t,p]) => `<div class="row" style="margin-bottom:6px"><span style="width:60px;font-weight:700">${t}</span><div style="flex:1;height:12px;background:#e3e9ee;border-radius:6px"><div style="height:12px;border-radius:6px;background:${p>15?'var(--r)':'var(--y)'};width:${Math.min(100,p*3)}%"></div></div><b style="width:44px;text-align:right">${p}%</b></div>`).join('')}</div></div></div>
   <div class="card" style="background:var(--g);color:#fff">💡 <b>Insight:</b> ${pr.length ? `"${esc(pr[pr.length-1].prato)}" teve só ${pr[pr.length-1].p}% de aprovação. Sugestão: trocar ou mudar a receita e acompanhar a pesagem das sobras na semana seguinte.` : 'Ainda não há avaliações suficientes.'}</div>
   <div class="note">Dados simulados para demonstração. Os dados por aluno ficam visíveis só para a gestão.</div>`;
};

     <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sm out" onclick="tabSimular()">Simular leitura</button></div>`;
  else if (tab.etapa === 'avaliar') { const a = aluno(tab.alunoId); const c = cardHoje();
    corpo = `<div class="row" style="justify-content:center">${foto(a, 64)}<div style="text-align:left"><b style="font-size:20px">${esc(a.nome)}</b><div class="sub">Turma ${esc(a.turma)} • ${esc(tab.ref)} registrado às ${tab.hora}</div></div></div>
     <div style="font-size:30px;font-weight:800;margin-top:18px">Como estava o ${esc(tab.ref.toUpperCase())} de hoje?</div>${fotoP(c[tab.ref]) ? `<img src="${fotoP(c[tab.ref])}" style="width:260px;height:170px;object-fit:contain;border-radius:16px;margin:10px auto 4px;display:block;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2))">` : ''}<div class="sub" style="font-size:17px">${esc(c[tab.ref] || '')}</div>
     <div class="notas4">${[1,2,3,4].map(n => `<div class="nt ${tab.nota===n?'on':''}" style="background:${NOTAS[n][2]}" onclick="tab.nota=${n};renderTablet()"><div style="font-size:64px">${NOTAS[n][0]}</div><b style="font-size:20px">${NOTAS[n][1]}</b></div>`).join('')}</div>
     <div style="font-size:20px;font-weight:700;margin-top:10px">O cardápio do totem foi seguido?</div>
     <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ${tab.seg===true?'':'out'}" style="width:150px;margin:0" onclick="tab.seg=true;renderTablet()">✔ Sim</button><button class="btn ${tab.seg===false?'red':'out'}" style="width:150px;margin:0" onclick="tab.seg=false;renderTablet()">✕ Não</button></div>
     <button class="btn" style="max-width:420px;margin:22px auto 0;font-size:19px;padding:15px" onclick="tabEnviar()">➤ Enviar avaliação</button>
     <div><button class="btn sm out" style="margin-top:12px" onclick="tab={etapa:'cart'};renderTablet()">Cancelar</button></div>`; }
  else { const m = {ok:['💚','Obrigado!','Sua opinião ajuda a melhorar o cardápio.','#dcf3e4'], ja:['🙂','Você já avaliou esta refeição.','Cada aluno avalia 1 vez por refeição, até o fim do dia.','#e5f0e1'], nao:['🍽','Só avalia quem pegou a refeição.','Passe a carteirinha no PDV antes de avaliar.','#fff3cd'], desc:['❓','Carteirinha não encontrada.','Procure a secretaria.','#fde2e4']}[tab.etapa];
    corpo = `<div style="background:${m[3]};border-radius:24px;padding:40px 20px;max-width:640px;margin:30px auto"><div style="font-size:90px">${m[0]}</div><div style="font-size:30px;font-weight:800">${m[1]}</div><div class="sub" style="font-size:18px;margin-top:8px">${m[2]}</div></div>`; setTimeout(() => { tab = {etapa:'cart'}; renderTablet(); }, 3500); }
  $('#app').innerHTML = `<div class="tablet"><div class="row" style="justify-content:space-between"><img src="logo_iema.png" style="height:42px"><div class="row">${ICON}<b style="font-size:22px"><span style="color:var(--b)">Eco</span><span style="color:var(--r)">Food</span></b></div><button class="btn sm out" onclick="telaCheia()">⛶ Tela cheia</button></div>
   <div style="text-align:center;flex:1;display:flex;flex-direction:column;justify-content:center">${corpo}</div></div>`;
  const i = $('#codTab'); if (i) i.focus();
}
function tabLer(cod) { cod = String(cod).trim(); const prov = DB.provisorias.find(p => p.codigo.toUpperCase() === cod.toUpperCase() && p.data === iso(hoje()));
  const a = prov ? aluno(prov.alunoId) : DB.alunos.find(x => x.carteirinha === cod || x.matricula === cod); if (!a) { tab = {etapa:'desc'}; return renderTablet(); }
  const regs = DB.registros.filter(x => x.alunoId === a.id && x.data === iso(hoje()) && !x.repeticao).sort((p,q) => q.hora.localeCompare(p.hora)); if (!regs.length) { tab = {etapa:'nao'}; return renderTablet(); }
  const pend = regs.find(x => !DB.avaliacoes.some(v => v.alunoId === a.id && v.data === x.data && v.refeicao === x.refeicao)); if (!pend) { tab = {etapa:'ja'}; return renderTablet(); }
  tab = {etapa:'avaliar', alunoId:a.id, ref:pend.refeicao, hora:pend.hora}; renderTablet(); }
function tabSimular() { const hojeR = DB.registros.filter(x => x.data === iso(hoje()) && !x.repeticao); const cand = hojeR.filter(x => !DB.avaliacoes.some(v => v.alunoId === x.alunoId && v.data === x.data && v.refeicao === x.refeicao));
  const l = cand.length && Math.random() > .15 ? cand : DB.alunos.map(a => ({alunoId:a.id})); const x = l[Math.floor(Math.random() * l.length)]; tabLer(aluno(x.alunoId).carteirinha); }
function tabEnviar() { if (!tab.nota) return toast('Escolha uma das 4 carinhas.'); if (tab.seg === undefined) return toast('Responda se o cardápio foi seguido.');
  DB.avaliacoes.push({id:uid(), alunoId:tab.alunoId, data:iso(hoje()), refeicao:tab.ref, prato:cardHoje()[tab.ref] || tab.ref, nota:tab.nota, seguido:tab.seg}); save(); tab = {etapa:'ok'}; renderTablet(); }

// ====================== JANELAS / AJUSTES ======================
TELAS.janelas = u => `${voltarBtn(ic('tv') + ' Totem e tablet')}<div class="sub" style="margin-bottom:12px">Cada tela abre numa janela própria, ligada ao mesmo sistema. Use o botão ⛶ (ou F11) para tela cheia e ESC para sair.</div>
   <div class="grid3"><div class="qa big" onclick="abrirJanela('totem')">${ic('tv',34)}<b>Totem do cardápio</b><span class="sub">TV de 32" no refeitório: cardápio do dia, da semana e a faixa de repetição.</span></div>
   <div class="qa big" onclick="abrirJanela('tablet')">${ic('tablet',34)}<b>Tablet de avaliação</b><span class="sub">Fora do PDV: o aluno passa a carteirinha e avalia (ruim, razoável, bom, ótimo).</span></div>
   <div class="qa big" onclick="abrirJanela('mural')">${ic('trophy',34)}<b>Mural do ranking</b><span class="sub">Pratos mais aprovados do mês e os que precisam melhorar.</span></div></div>
   <div class="note">Dica para a apresentação: deixe o totem aberto ao lado, vá ao painel da cozinha e clique em "Liberar repetição" — a faixa aparece na hora.</div>`;
TELAS.ajustes = u => `${voltarBtn(ic('gear') + ' Ajustes')}<div class="card" style="max-width:640px"><div class="ttl">Meus dados</div><label class="lbl">Nome</label><input id="un" value="${esc(u.nome)}"><label class="lbl">Nova senha (opcional)</label><input id="us" type="password" placeholder="deixe em branco para manter">
   <button class="btn" onclick="const x=me();x.nome=$('#un').value.trim()||x.nome;if($('#us').value.trim())x.senha=$('#us').value.trim();save();toast('Dados salvos!');render()">Salvar</button></div>
   <div class="card" style="max-width:640px">🛡 <b>IEMA Pleno de Coroatá</b><div class="sub">EcoFood • relatórios da carteirinha. Os dados ficam salvos neste computador (protótipo).</div></div>
   <div style="max-width:640px"><button class="btn gray" onclick="sair()">${ic('swap',18)} Trocar usuário / sair</button>
   <button class="btn out" style="color:var(--r);border-color:var(--r)" onclick="confirmar('Restaurar dados de exemplo?','Tudo o que foi registrado neste computador será apagado e o programa volta ao início.',()=>{localStorage.removeItem(KEY);load();renderLogin();toast('Dados de exemplo restaurados.')},'Restaurar')">Restaurar dados de exemplo</button></div>
   <div class="note">EcoFood • versão 1.5 para Windows • protótipo do TCC IEMA 2026 (Grupo 3)</div>`;

// ====================== início ======================
load(); render();
if (!location.hash) { const s = document.createElement('div'); s.id = 'splash';
  s.innerHTML = '<img src="logo_iema.png" alt="IEMA"><div class="ap">' + ICON.replace('width="34" height="34"','width="50" height="50"') + '<div><span style="color:var(--b)">Eco</span><span style="color:var(--r)">Food</span></div></div><div class="ld"><i></i></div><div style="font-size:11px;letter-spacing:2px;color:#9a8a70;font-weight:600">PROJETO DESPERDÍCIO ZERO</div>';
  document.body.appendChild(s); setTimeout(() => { s.style.opacity = 0; setTimeout(() => s.remove(), 450); }, 1500); }
window.addEventListener('storage', e => { if (e.key === KEY) { load(); const m = location.hash; if (m === '#totem' || m === '#mural') render(); else if (m === '#tablet') { if (tab.etapa === 'cart') renderTablet(); } else if (!$('input:focus')) render(); } });
setInterval(() => { const r = $('#relogio'); if (r) r.textContent = hhmm(); if (location.hash === '#totem') { load(); renderTotem(); } }, 20000);
window.addEventListener('hashchange', () => render());
</script>

</body>
</html>
