name: Simulador offline (zip)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [".github/workflows/fontes.yml", "fonts/**"]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar o simulador
        run: |
          export TZ=America/Sao_Paulo
          bash simulador/montar.sh "${{ github.run_number }}" "$(date +%d/%m/%Y)"
      - name: Publicar o zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: simulador-${{ github.run_number }}
          name: Simulador TCC IEMA 2026 — versão ${{ github.run_number }}
          body: "Simulador offline com os 3 protótipos. Baixe o zip, extraia e abra ABRIR_SIMULADOR.html."
          make_latest: true
          files: dist/Simulador_TCC_IEMA_2026.zip
